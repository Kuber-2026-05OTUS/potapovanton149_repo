global:
  enabled: true
  tlsDisable: true

injector:
  enabled: true

server:
  enabled: true
  replicas: 3
  ha:
    enabled: true
    replicas: 3
    config: |
      ui = true

      listener "tcp" {
        tls_disable = 1
        address = "[::]:8200"
        cluster_address = "[::]:8201"
      }

      storage "consul" {
        path = "vault/"
        address = "consul-server.consul.svc.cluster.local:8500"
        scheme = "http"
      }

      service_registration "kubernetes" {}

  service:
    enabled: true
    type: ClusterIP