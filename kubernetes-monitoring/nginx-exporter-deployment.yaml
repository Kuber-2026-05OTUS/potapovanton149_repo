apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-exporter
  namespace: homework
  labels:
    app: nginx-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-exporter
  template:
    metadata:
      labels:
        app: nginx-exporter
    spec:
      containers:
      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:0.11.0
        args:
          - -nginx.scrape-uri=http://nginx-with-metrics:8080/stub_status
        ports:
        - containerPort: 9113
          name: metrics