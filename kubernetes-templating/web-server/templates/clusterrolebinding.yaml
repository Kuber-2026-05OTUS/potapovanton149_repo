{{- if .Values.rbac.monitoringClusterRoleBinding.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.rbac.monitoringClusterRoleBinding.name }}
  labels:
    {{- include "web-server.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccounts.monitoring.name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .Values.rbac.monitoringClusterRole.name }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}