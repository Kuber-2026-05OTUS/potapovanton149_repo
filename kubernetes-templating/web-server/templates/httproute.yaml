{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "web-server.fullname" . }}-httproute
  labels:
    {{- include "web-server.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "web-server.fullname" . }}-gateway
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    {{- if .Values.httpRoute.rules.homepage.enabled }}
    - matches:
        - path:
            type: {{ .Values.httpRoute.rules.homepage.match.path.type }}
            value: {{ .Values.httpRoute.rules.homepage.match.path.value }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: {{ .Values.httpRoute.rules.homepage.filter.urlRewrite.type }}
              replaceFullPath: {{ .Values.httpRoute.rules.homepage.filter.urlRewrite.replaceFullPath }}
      backendRefs:
        - name: {{ include "web-server.fullname" . }}
          port: {{ .Values.service.port }}
    {{- end }}
    {{- if .Values.httpRoute.rules.root.enabled }}
    - matches:
        - path:
            type: {{ .Values.httpRoute.rules.root.match.path.type }}
            value: {{ .Values.httpRoute.rules.root.match.path.value }}
      backendRefs:
        - name: {{ include "web-server.fullname" . }}
          port: {{ .Values.service.port }}
    {{- end }}
{{- end }}