replicaCount: 1

image:
  registry: docker.io
  repository: bitnami/kafka
  tag: latest
  pullPolicy: IfNotPresent

zookeeper:
  enabled: false

controller:
  replicaCount: 1
  persistence:
    enabled: false

auth:
  clientProtocol: plaintext
  interBrokerProtocol: plaintext
  sasl:
    enabled: false

persistence:
  enabled: false

externalAccess:
  enabled: false

resources:
  requests:
    memory: "256Mi"
    cpu: "100m"
  limits:
    memory: "512Mi"
    cpu: "250m"