apiVersion: v1
kind: Pod
metadata:
  name: nginx-distroless
  labels:
    app: nginx-distroless
spec:
  containers:
    - name: nginx
      image: kyos0109/nginx-distroless:latest
      ports:
        - containerPort: 80
          name: http
      resources:
        limits:
          cpu: "200m"
          memory: "128Mi"
        requests:
          cpu: "100m"
          memory: "64Mi"